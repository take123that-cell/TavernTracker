    <g fill="#E6CC98" opacity="0.8"><circle cx="236" cy="236" r="4"/><circle cx="296" cy="228" r="3"/><circle cx="208" cy="244" r="3"/><circle cx="330" cy="238" r="3.5"/></g>
    <circle cx="214" cy="200" r="6" fill="#FFFFFF" opacity="0.95"/>
