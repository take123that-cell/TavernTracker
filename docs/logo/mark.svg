      <line x1="38.9" y1="177.0" x2="31.4" y2="174.3"/>
      <line x1="57.7" y1="141.5" x2="47.3" y2="135.5"/>
      <line x1="79.0" y1="107.5" x2="72.9" y2="102.4"/>
      <line x1="107.5" y1="79.0" x2="102.4" y2="72.9"/>
      <line x1="141.5" y1="57.7" x2="135.5" y2="47.3"/>
      <line x1="177.0" y1="38.9" x2="174.3" y2="31.4"/>
      <line x1="215.9" y1="28.5" x2="214.5" y2="20.6"/>
      <line x1="296.1" y1="28.5" x2="297.5" y2="20.6"/>
