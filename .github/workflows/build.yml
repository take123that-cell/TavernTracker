# Builds TavernTracker.exe on GitHub's Windows machines and publishes it as a Release
# (Releases page → Latest → TavernTracker.exe). Also kept as an artifact on the Actions tab.
name: Build TavernTracker.exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet run --project tests/TavernTracker.Tests -c Release

      - name: Publish single-file exe
        run: dotnet publish src/TavernTracker.App/TavernTracker.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.0.${{ github.run_number }} -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: TavernTracker
          path: dist/TavernTracker.exe

      # Every build on main becomes a release with the .exe attached (newest = "Latest").
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Tavern Tracker ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          body: |
            Download **TavernTracker.exe** below and run it. One file, nothing to install.
            First time only: restart Hearthstone after starting Tavern Tracker so its game log is switched on.
          make_latest: true
          files: dist/TavernTracker.exe
